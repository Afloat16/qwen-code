name: Memory withheld validation

on:
  push:
    branches:
      - validation/memory-withheld-20261113

permissions:
  contents: read

jobs:
  memory-and-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 43f448d730256158feb6c3f3194873b42cfe2637
          persist-credentials: false
      - name: Verify the tested source
        run: |
          test "$(git rev-parse HEAD)" = 43f448d730256158feb6c3f3194873b42cfe2637
          git show --no-patch --format=fuller HEAD
          free -h
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
      - name: Install locked dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --reporter=append-only 2>&1 | tee install-validation.log
      - name: Build all workspaces
        id: build
        run: npm run build 2>&1 | tee workspace-build-validation.log
      - name: Check all workspace and integration types
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee workspace-types-validation.log
      - name: Run daemon file HTTP regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: packages/cli
        run: CI=1 corepack pnpm exec vitest run src/serve/workspace-memory.test.ts --maxWorkers=1 --reporter=default 2>&1 | tee ../../daemon-file-validation.log
      - name: Run Web Shell memory hook and panel regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: packages/web-shell
        run: CI=1 corepack pnpm exec vitest run client/daemon/workspace/hooks/useDaemonMemory.test.tsx client/components/messages/MemoryMessage.test.tsx --maxWorkers=1 --reporter=default 2>&1 | tee ../../web-memory-validation.log
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: memory-withheld-validation-43f448d7
          path: |
            *-validation.log
            packages/cli/junit.xml
            packages/web-shell/junit.xml
          if-no-files-found: warn
          retention-days: 14
