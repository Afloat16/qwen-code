name: Qwen 17120 R3 unchanged bundle baseline
on:
  push:
    branches:
      - validation/qwen17120-r3-bundle-baseline-20261113
permissions:
  contents: read
jobs:
  reproduce:
    name: Exact 546de145 bundle / three real MCP cases
    if: github.repository == 'Afloat16/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      CANDIDATE_SHA: 546de1455e62c4187288f0ce77248bf72b393f76
      CANDIDATE_TREE: 334e5cbcddf8ed3c77625104d76140c2058af46c
    steps:
      - name: Check out independent scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: verification
          sparse-checkout: .github/validation/17120-r3
          persist-credentials: false
      - name: Check out exact unchanged production
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Afloat16/qwen-code
          ref: 546de1455e62c4187288f0ce77248bf72b393f76
          path: source
          persist-credentials: false
      - name: Verify unchanged source
        run: |
          mkdir -p "$RUNNER_TEMP/qwen17120-r3-bundle-baseline"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test -z "$(git status --porcelain)"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
      - name: Install locked dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Build exact workspaces
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/qwen17120-r3-bundle-baseline/build.log"
      - name: Bundle the exact unchanged CLI
        run: npm run bundle 2>&1 | tee "$RUNNER_TEMP/qwen17120-r3-bundle-baseline/bundle-build.log"
      - name: Record real prefix typo and numeric persistence with list control
        run: python3 ../verification/.github/validation/17120-r3/bundle.py baseline
      - name: Check unchanged source after isolated cases
        if: always()
        run: git diff --exit-code
      - name: Preserve baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qwen17120-r3-bundle-baseline
          path: ${{ runner.temp }}/qwen17120-r3-bundle-baseline/
          if-no-files-found: error
          retention-days: 14
