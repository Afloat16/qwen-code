name: Qwen 17118 R2 deadline validation

on:
  push:
    branches:
      - validation/qwen17118-r2-20261113

permissions:
  contents: read

jobs:
  validate:
    name: Exact candidate build, types, bundle, and deadline regressions
    if: github.repository == 'Afloat16/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      CANDIDATE_SHA: 7a990a5d0736023f0745620e708eed559fa6fce9
      CANDIDATE_TREE: 1f0027b6a5880b0655c187751fc2a1e72b036475
    steps:
      - name: Check out validation scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: verification
          persist-credentials: false
          sparse-checkout: .github/validation
      - name: Check out the exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Afloat16/qwen-code
          ref: 7a990a5d0736023f0745620e708eed559fa6fce9
          path: source
          persist-credentials: false
          fetch-depth: 2
      - name: Record source identity
        run: |
          mkdir -p "$RUNNER_TEMP/qwen17118-r2-validation"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test "$(git rev-parse HEAD^)" = f5a08285854d03543c586e0bfdcc826acc1c32ec
          git show --no-patch --format=fuller HEAD > "$RUNNER_TEMP/qwen17118-r2-validation/source.log"
          git diff --stat HEAD^ HEAD >> "$RUNNER_TEMP/qwen17118-r2-validation/source.log"
          git diff --check HEAD^ HEAD
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
      - name: Install locked dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          corepack enable
          {
            node --version
            corepack pnpm --version
            corepack pnpm install --frozen-lockfile --reporter=append-only
          } 2>&1 | tee "$RUNNER_TEMP/qwen17118-r2-validation/install.log"
      - name: Build all workspaces
        id: build
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/qwen17118-r2-validation/build.log"
      - name: Check all workspace and integration types
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/qwen17118-r2-validation/typecheck.log"
      - name: Check changed source and documentation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          corepack pnpm exec eslint packages/cli/src/commands/review/run.ts packages/cli/src/commands/review/run.test.ts --max-warnings 0
          corepack pnpm exec prettier --check packages/cli/src/commands/review/run.ts packages/cli/src/commands/review/run.test.ts packages/core/src/skills/bundled/review/SKILL.md docs/users/configuration/settings.md docs/users/features/code-review.md
      - name: Bundle the exact candidate
        id: bundle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run bundle 2>&1 | tee "$RUNNER_TEMP/qwen17118-r2-validation/bundle.log"
      - name: Verify candidate, parent, and narrow mutations with standard test setup
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: python3 ../verification/.github/validation/qwen17118-r2-validate.py
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qwen17118-r2-${{ env.CANDIDATE_SHA }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen17118-r2-validation/
          if-no-files-found: error
          retention-days: 14
