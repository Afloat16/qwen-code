name: Qwen 17123 committed guard counterfactual
on:
  push:
    branches:
      - validation/qwen17123-r2-guard-round7-20261113
permissions:
  contents: read
jobs:
  guard:
    name: Two committed nested-object regressions catch the old guard
    if: github.repository == 'Afloat16/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out owner-run verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: verification
          persist-credentials: false
          sparse-checkout: .github/validation
      - name: Check out the exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Afloat16/qwen-code
          ref: b86af9512bb437b63fc014ff2e8aa74b7f42c9b4
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
      - name: Install frozen dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Build workspace prerequisites
        run: npm run build
      - name: Run the two committed cases with the parent guard then restore
        run: python3 ../verification/.github/validation/17123-r2-guard-check.py
      - name: Preserve counterfactual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qwen17123-r2-guard-check
          path: ${{ runner.temp }}/qwen17123-r2-guard-check/
          if-no-files-found: error
          retention-days: 14
