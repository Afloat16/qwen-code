name: SDK capabilities validation

on:
  push:
    branches:
      - validation/sdk-capabilities-20261113

permissions:
  contents: read

jobs:
  sdk-and-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 43a07dcde307751ab76f14cd177c8badcd83a91d
          persist-credentials: false
      - name: Verify the tested source
        run: |
          test "$(git rev-parse HEAD)" = 43a07dcde307751ab76f14cd177c8badcd83a91d
          git show --no-patch --format=fuller HEAD
          free -h
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
      - name: Install locked dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --reporter=append-only 2>&1 | tee install-validation.log
      - name: Build the SDK
        run: npm run build --workspace=@qwen-code/sdk 2>&1 | tee sdk-build-validation.log
      - name: Check SDK types
        run: npm run typecheck --workspace=@qwen-code/sdk 2>&1 | tee sdk-types-validation.log
      - name: Run the complete SDK suite
        working-directory: packages/sdk-typescript
        run: npm run test:ci -- --maxWorkers=2 2>&1 | tee ../../sdk-suite-validation.log
      - name: Build all workspaces
        run: npm run build 2>&1 | tee workspace-build-validation.log
      - name: Check all workspace and integration types
        run: npm run typecheck 2>&1 | tee workspace-types-validation.log
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sdk-capabilities-validation-43a07dcd
          path: |
            *-validation.log
            packages/sdk-typescript/junit.xml
          if-no-files-found: warn
          retention-days: 14
