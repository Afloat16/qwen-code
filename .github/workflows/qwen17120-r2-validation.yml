name: Qwen 17120 R2 separator validation

on:
  push:
    branches:
      - validation/qwen17120-r2-20261113

permissions:
  contents: read

jobs:
  validate:
    name: Exact candidate build, types, bundle, and MCP regressions
    if: github.repository == 'Afloat16/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      CANDIDATE_SHA: 546de1455e62c4187288f0ce77248bf72b393f76
      CANDIDATE_TREE: 334e5cbcddf8ed3c77625104d76140c2058af46c
      EXPECTED_CLI_TEST_COUNT: '155'
    steps:
      - name: Check out the validation scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: verification
          persist-credentials: false
          sparse-checkout: .github/validation
      - name: Check out the exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Afloat16/qwen-code
          ref: 546de1455e62c4187288f0ce77248bf72b393f76
          path: source
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source identity and preserve the independent fixture
        run: |
          mkdir -p "$RUNNER_TEMP/qwen-r2-validation"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test "$(git rev-parse HEAD^)" = 1c8ea983faf86dbaa0a958741f1c6cd76f8e937d
          git show --no-patch --format=fuller HEAD > "$RUNNER_TEMP/qwen-r2-validation/source.log"
          git diff --check HEAD^ HEAD
          cp ../verification/.github/validation/qwen17120-r2-validate.py "$RUNNER_TEMP/qwen-r2-validation/"
          cp ../verification/.github/validation/run-isolated-cli.py "$RUNNER_TEMP/qwen-r2-validation/"
          cp ../verification/.github/validation/isolated-home.mjs "$RUNNER_TEMP/qwen-r2-validation/"
          cp ../verification/.github/validation/register-source.mjs "$RUNNER_TEMP/qwen-r2-validation/"
          cp ../verification/.github/validation/qwen17120-r2-local-prerequisites.json "$RUNNER_TEMP/qwen-r2-validation/"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
      - name: Install locked dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          corepack enable
          {
            node --version
            corepack pnpm --version
            corepack pnpm install --frozen-lockfile --reporter=append-only
          } 2>&1 | tee "$RUNNER_TEMP/qwen-r2-validation/install.log"
      - name: Build all workspaces
        id: build
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/qwen-r2-validation/build.log"
      - name: Check all workspace and integration types
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/qwen-r2-validation/typecheck.log"
      - name: Check changed source and documentation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          corepack pnpm exec eslint packages/cli/src/cli.ts packages/cli/src/cli.test.ts --max-warnings 0
          corepack pnpm exec prettier --check packages/cli/src/cli.ts packages/cli/src/cli.test.ts docs/users/features/mcp.md
      - name: Bundle the exact candidate CLI
        id: bundle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run bundle 2>&1 | tee "$RUNNER_TEMP/qwen-r2-validation/bundle.log"
      - name: Verify candidate, parent, and targeted mutations
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: python3 ../verification/.github/validation/qwen17120-r2-validate.py
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qwen17120-r2-${{ env.CANDIDATE_SHA }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen-r2-validation/
          if-no-files-found: error
          retention-days: 14
