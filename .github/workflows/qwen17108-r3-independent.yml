name: Qwen 17108 R3 independent verification
on:
  push:
    branches:
      - validation/qwen17108-r3-independent-20261113
permissions:
  contents: read
jobs:
  reproduce:
    name: Exact candidate / independent React verification
    if: github.repository == 'Afloat16/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      SOURCE_SHA: caa528f0d4dcccf5521971d902257c3ecdeed8cd
      SOURCE_TREE: 7aa78313c8489ed31b7e8d9e0a4b0ce1763a608e
    steps:
      - name: Check out independent scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: verification
          sparse-checkout: .github/validation/17108-r3-independent
          persist-credentials: false
      - name: Check out exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Afloat16/qwen-code
          ref: caa528f0d4dcccf5521971d902257c3ecdeed8cd
          path: source
          persist-credentials: false
      - name: Record source and global CLI availability
        run: |
          mkdir -p "$RUNNER_TEMP/qwen17108-r3-independent-verification"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git status --porcelain
          if command -v qwen >/dev/null 2>&1; then
            qwen --version > "$RUNNER_TEMP/qwen17108-r3-independent-verification/global-qwen.log" 2>&1 || true
          else
            printf '%s\n' 'Global qwen unavailable on this runner; interactive Web Shell state is tested through the real React/hook source.' > "$RUNNER_TEMP/qwen17108-r3-independent-verification/global-qwen.log"
          fi
          cat "$RUNNER_TEMP/qwen17108-r3-independent-verification/global-qwen.log"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
      - name: Install locked dependencies without building product source
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Build the exact runtime prerequisites for the browser daemon SDK
        run: |
          corepack pnpm exec esbuild packages/acp-bridge/src/daemonEventTypes.ts packages/acp-bridge/src/mcpTimeouts.ts packages/acp-bridge/src/channel-control-timeouts.ts packages/acp-bridge/src/bridgeTypes.ts --bundle --format=esm --platform=browser --target=es2022 --outdir=packages/acp-bridge/dist
          corepack pnpm exec esbuild packages/sdk-typescript/src/daemon/index.ts --bundle --format=esm --platform=browser --target=es2022 --outfile=packages/sdk-typescript/dist/daemon/index.js --minify --legal-comments=none --tree-shaking=true
          test -s packages/sdk-typescript/dist/daemon/index.js
          git diff --exit-code
      - name: Run exact candidate with independent fixture
        run: python3 ../verification/.github/validation/17108-r3-independent/run.py verification
      - name: Preserve independent evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qwen17108-r3-independent-verification
          path: ${{ runner.temp }}/qwen17108-r3-independent-verification/
          if-no-files-found: error
          retention-days: 14
