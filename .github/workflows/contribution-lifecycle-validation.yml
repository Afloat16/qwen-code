name: Python SDK lifecycle contribution validation

on:
  push:
    branches: [validation/python-lifecycle-20261116]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    name: SDK ${{ matrix.change }} / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        change: [control-cleanup, close-start]
        include:
          - change: control-cleanup
            ref: e96d8980f129433b09c16dd76ed21e8a4dce5542
          - change: close-start
            ref: 905841175ce10efac4ba68f0b9882a466a262c6f
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact production commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = '${{ matrix.ref }}'
      - run: python -m pip install -e 'packages/sdk-python[dev]'
      - run: python -m ruff check --config packages/sdk-python/pyproject.toml packages/sdk-python
      - run: python -m ruff format --check --config packages/sdk-python/pyproject.toml packages/sdk-python
      - run: python -m mypy --config-file packages/sdk-python/pyproject.toml packages/sdk-python/src
      - run: python -m pytest -c packages/sdk-python/pyproject.toml packages/sdk-python/tests -q

  platform:
    name: SDK ${{ matrix.change }} / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        change: [control-cleanup, close-start]
        include:
          - change: control-cleanup
            ref: e96d8980f129433b09c16dd76ed21e8a4dce5542
          - change: close-start
            ref: 905841175ce10efac4ba68f0b9882a466a262c6f
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Verify exact production commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = '${{ matrix.ref }}'
      - run: python -m pip install -e 'packages/sdk-python[dev]'
      - run: python -m pytest -c packages/sdk-python/pyproject.toml packages/sdk-python/tests -q

  repository:
    name: Repository preflight / ${{ matrix.change }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - change: control-cleanup
            ref: e96d8980f129433b09c16dd76ed21e8a4dce5542
          - change: close-start
            ref: 905841175ce10efac4ba68f0b9882a466a262c6f
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.x'
      - name: Verify exact production commit
        run: test "$(git rev-parse HEAD)" = '${{ matrix.ref }}'
      - run: corepack enable
      - name: Bootstrap dependencies for the clean script
        env:
          QWEN_SKIP_PREPARE: '1'
        run: corepack pnpm install --frozen-lockfile
      - name: Run required unmodified repository preflight
        run: npm run preflight
      - name: Bundle
        run: npm run bundle
      - name: Confirm tracked source unchanged by validation
        run: git diff --exit-code
