name: MCP review blocker validation

on:
  push:
    branches:
      - validation/qwen-mcp-blockers-20261114

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Afloat16/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      SOURCE_SHA: 0011890a48a2e9d1775453d096a4e5c8a1982076
      SOURCE_TREE: b3c7bd4e666d3096f9dee359198ca84e5a8bc511
    steps:
      - name: Check out candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Afloat16/qwen-code
          ref: 0011890a48a2e9d1775453d096a4e5c8a1982076
          path: source
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test "$(git rev-parse HEAD^)" = 9c48bdcd106ee04f792dfa754866d00bb8fc19df
          git diff --check HEAD^ HEAD
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
      - name: Install frozen dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Formatting
        run: corepack pnpm exec prettier --check packages/cli/src/commands/mcp/add.ts packages/cli/src/commands/mcp/add.test.ts packages/cli/src/commands/mcp.test.ts
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Bundle
        run: npm run bundle
      - name: Lint
        run: corepack pnpm exec eslint packages/cli/src/commands/mcp/add.ts packages/cli/src/commands/mcp/add.test.ts packages/cli/src/commands/mcp.test.ts --max-warnings 0
      - name: Candidate regression suites
        working-directory: source/packages/cli
        run: corepack pnpm exec vitest run src/commands/mcp.test.ts src/commands/mcp/add.test.ts src/cli.test.ts --coverage.enabled=false --maxWorkers=2 --no-file-parallelism
      - name: Built CLI persistence boundaries
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const cli = path.resolve('dist/cli.js');
          const root = fs.mkdtempSync(path.join(os.tmpdir(), 'mcp-blockers-'));
          const ambiguous = [
            ['run', '--env-file', '.env', 'image'],
            ['run', '--env-file=.env', 'image'],
            ['run', '--timeout-secs', '5', 'image'],
            ['run', '--header-x=y', 'image'],
            ['run', '--trust-all', 'image'],
            ['run', '--description-x', 'value', 'image'],
            ['run', '--scope-x', 'value', 'image'],
          ];
          const controls = [
            { tail: ['run', '-d', 'alpine'], args: ['run', '-d', 'alpine'] },
            { tail: ['run', '--args', 'value'], args: ['run', '--args', 'value'] },
            { tail: ['run', '--args=value', 'image'], args: ['run', '--args=value', 'image'] },
            { tail: ['0x10', '--timeout', '1500'], args: ['0x10'], timeout: 1500 },
            { tail: ['infix', '--', 'dash', '--env-file', '.env'], args: ['infix', 'dash', '--env-file', '.env'] },
          ];
          let count = 0;
          try {
            for (const prefix of [[], ['--debug']]) {
              for (const entry of [...ambiguous.map(tail => ({ tail, reject: true })), ...controls]) {
                const dir = path.join(root, String(++count));
                const config = path.join(dir, 'config');
                const work = path.join(dir, 'workspace');
                fs.mkdirSync(config, { recursive: true });
                fs.mkdirSync(work);
                const settings = path.join(config, 'settings.json');
                const original = JSON.stringify({ $version: 4, mcpServers: { sentinel: { command: 'node', args: [] } } });
                fs.writeFileSync(settings, original);
                const result = spawnSync(process.execPath, [cli, 'mcp', ...prefix, 'add', 'candidate', 'docker', ...entry.tail], {
                  cwd: work,
                  env: { ...process.env, QWEN_HOME: config },
                  encoding: 'utf8',
                  timeout: 30000,
                });
                assert.equal(result.error, undefined);
                if (entry.reject) {
                  assert.equal(result.status, 1, result.stdout + result.stderr);
                  assert.match(result.stdout + result.stderr, /Unknown arguments/);
                  assert.equal(fs.readFileSync(settings, 'utf8'), original);
                  assert.equal(fs.existsSync(path.join(config, 'mcp-oauth-tokens.json')), false);
                } else {
                  assert.equal(result.status, 0, result.stdout + result.stderr);
                  const saved = JSON.parse(fs.readFileSync(settings, 'utf8')).mcpServers;
                  assert.deepEqual(saved.sentinel, { command: 'node', args: [] });
                  assert.deepEqual(saved.candidate.args, entry.args);
                  assert.equal(saved.candidate.timeout, entry.timeout);
                }
                console.log(JSON.stringify({ prefix, tail: entry.tail, exit: result.status, expectedRejection: !!entry.reject }));
              }
            }
            console.log('Built CLI cases passed: ' + count);
          } finally {
            fs.rmSync(root, { recursive: true, force: true });
          }
          JS
      - name: Baseline must reproduce both blockers
        run: |
          trap 'git restore packages/cli/src/commands/mcp/add.ts packages/cli/src/commands/mcp.test.ts' EXIT
          git show HEAD^:packages/cli/src/commands/mcp/add.ts > packages/cli/src/commands/mcp/add.ts
          git show HEAD^:packages/cli/src/commands/mcp.test.ts > packages/cli/src/commands/mcp.test.ts
          cd packages/cli
          set +e
          corepack pnpm exec vitest run src/commands/mcp.test.ts src/commands/mcp/add.test.ts --coverage.enabled=false --maxWorkers=2 --no-file-parallelism --reporter=json --outputFile="$RUNNER_TEMP/mcp-parent.json"
          result=$?
          set -e
          test "$result" = 1
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/mcp-parent.json","utf8")); console.log(JSON.stringify({failed:r.numFailedTests,passed:r.numPassedTests})); assert.equal(r.numFailedTests,8);'
          cd ../..
      - name: Check source remained unchanged
        run: |
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
