name: Review follow-up validation

on:
  push:
    branches:
      - validation/qwen-review-round5-20261113

permissions:
  contents: read

jobs:
  validate:
    name: PR ${{ matrix.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 17108
            sha: 57a7e226617c0ef376a21205651b0c246007fabc
            package: packages/web-shell
            tests: client/components/messages/MemoryMessage.test.tsx
          - pr: 17112
            sha: 11ce55a1235efe5ea80ca151ce79cb587904aac8
            package: packages/core
            tests: src/services/shellExecutionService.test.ts
          - pr: 17122
            sha: 37dc396f373d82ab419785b5928097d849eed4b5
            package: packages/cli
            tests: src/ui/utils/todoSnapshot.test.ts src/ui/utils/todoSnapshot.mcp.test.ts
    defaults:
      run:
        shell: bash
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Verify the tested source
        run: |
          test "$(git rev-parse HEAD)" = '${{ matrix.sha }}'
          git show --no-patch --format=fuller HEAD
          git diff --check HEAD^ HEAD
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
      - name: Install locked dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --reporter=append-only 2>&1 | tee install-validation.log
      - name: Build all workspaces
        id: build
        run: npm run build 2>&1 | tee workspace-build-validation.log
      - name: Check all workspace and integration types
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee workspace-types-validation.log
      - name: Run focused regressions
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{ matrix.package }}
        run: CI=1 corepack pnpm exec vitest run ${{ matrix.tests }} --maxWorkers=1 --reporter=default --retry=0 2>&1 | tee ../../focused-validation.log
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-validation-${{ matrix.pr }}
          path: |
            *-validation.log
            ${{ matrix.package }}/junit.xml
          if-no-files-found: warn
          retention-days: 14
