name: Qwen 17120 R3 exact candidate validation
on:
  push:
    branches:
      - validation/qwen17120-r3-candidate-20261113
permissions:
  contents: read
jobs:
  validate:
    name: Exact candidate build, types, bundle, and MCP regressions
    if: github.repository == 'Afloat16/qwen-code'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=6144
      CANDIDATE_SHA: 40978fcaae8aed6cbc67bc4c11e46b099a4450bd
      CANDIDATE_TREE: a3cc3760cc5ea0eae582e062ddafabd2f28c16f5
    steps:
      - name: Check out validation scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: verification
          sparse-checkout: .github/validation/17120-r3
          persist-credentials: false
      - name: Check out exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Afloat16/qwen-code
          ref: 40978fcaae8aed6cbc67bc4c11e46b099a4450bd
          path: source
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and four-file scope
        run: |
          mkdir -p "$RUNNER_TEMP/qwen17120-r3-validation"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test "$(git rev-parse HEAD^)" = 546de1455e62c4187288f0ce77248bf72b393f76
          git diff --check HEAD^ HEAD
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          paths = ['packages/cli/src/cli.test.ts', 'packages/cli/src/cli.ts', 'packages/cli/src/commands/mcp/add.test.ts', 'packages/cli/src/commands/mcp/add.ts']
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
          assert sorted(changed) == sorted(paths), changed
          identity = {path: {'git_blob': subprocess.check_output(['git', 'hash-object', path], text=True).strip(), 'sha256': hashlib.sha256(Path(path).read_bytes()).hexdigest()} for path in paths}
          print(json.dumps(identity, indent=2))
          (Path(os.environ['RUNNER_TEMP']) / 'qwen17120-r3-validation/source-identity.json').write_text(json.dumps(identity, indent=2) + '\n')
          PY
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
      - name: Install locked dependencies
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |
          corepack enable
          node --version
          corepack pnpm --version
          corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Check the four changed files
        run: |
          changed=(packages/cli/src/cli.ts packages/cli/src/cli.test.ts packages/cli/src/commands/mcp/add.ts packages/cli/src/commands/mcp/add.test.ts)
          corepack pnpm exec eslint "${changed[@]}" --max-warnings 0
          corepack pnpm exec prettier --check "${changed[@]}"
      - name: Check exact builder types and parser before the full build
        run: node ../verification/.github/validation/17120-r3/builder-preflight.mjs
      - name: Build all workspaces
        id: build
        run: npm run build 2>&1 | tee "$RUNNER_TEMP/qwen17120-r3-validation/build.log"
      - name: Check all workspace and integration types
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/qwen17120-r3-validation/typecheck.log"
      - name: Bundle the exact candidate CLI
        id: bundle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run bundle 2>&1 | tee "$RUNNER_TEMP/qwen17120-r3-validation/bundle-build.log"
      - name: Verify both suites, three actual CLI cases, and targeted counterfactuals
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        run: python3 ../verification/.github/validation/17120-r3/candidate.py
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qwen17120-r3-${{ env.CANDIDATE_SHA }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qwen17120-r3-validation/
          if-no-files-found: error
          retention-days: 14
